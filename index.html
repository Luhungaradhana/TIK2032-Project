<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Website Sederhana</title>
    <style>
        /* Reset Dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            scroll-behavior: smooth;
        }

        /* Background dan Body Style */
        body {
            background: linear-gradient(120deg, #f5f7fa, #c3cfe2);
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
            padding: 20px;
        }

        /* Navbar Modern */
        .navbar {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            display: inline-block;
            margin-bottom: 40px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .navbar a {
            color: #4a6fa5;
            text-decoration: none;
            margin: 0 20px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
        }

        .navbar a:after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -5px;
            left: 0;
            background-color: #4a6fa5;
            transition: width 0.3s ease;
        }

        .navbar a:hover {
            color: #2c3e50;
        }

        .navbar a:hover:after {
            width: 100%;
        }

        /* Container Style */
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 50px 40px;
            border-radius: 16px;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            animation: scaleIn 0.6s ease-out;
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 20px;
            color: #2c3e50;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        p {
            color: #5d6d7e;
            font-size: 1.1rem;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        /* Tombol Interaktif */
        .btn-sapa {
            padding: 12px 28px;
            font-size: 16px;
            background-color: #4a6fa5;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            color: white;
            box-shadow: 0 4px 6px rgba(74, 111, 165, 0.2);
        }

        .btn-sapa:hover {
            background-color: #3a5a80;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(74, 111, 165, 0.3);
        }

        .btn-sapa:active {
            transform: translateY(0);
        }

        #hasilSapa {
            margin-top: 20px;
            font-size: 1.1rem;
            color: #4a6fa5;
            font-weight: 500;
        }

        /* Responsive Desain */
        @media (max-width: 600px) {
            .navbar {
                padding: 12px 15px;
            }
            .navbar a { 
                margin: 0 10px; 
                font-size: 14px; 
            }
            h1 { 
                font-size: 2.2rem; 
            }
            .container {
                padding: 30px 20px;
            }
            p, #hasilSapa { 
                font-size: 1rem; 
            }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <a href="index.html">Home</a>
        <a href="gallery.php">Gallery</a>
        <a href="blog.html">Blog</a>
        <a href="contact.html">Contact</a>
    </div>

    <!-- Container -->
    <div class="container">
        <h1>Selamat Datang di Website Saya!</h1>
        <p>Salam Kenal, Nama Saya <strong>Muhammad Luhung Aradhana</strong></p>

        <!-- Tombol Interaktif -->
        <button id="sapaButton" class="btn-sapa">Silahkan klik</button>
        <p id="hasilSapa"></p>
    </div>

    <!-- File JavaScript -->
    <script src="script.js"></script>
</body>
</html>
