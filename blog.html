<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Website Sederhana</title>
    <style>
        /* --- CSS ASLI ANDA --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background: linear-gradient(120deg, #f5f7fa, #c3cfe2);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            border-radius: 12px;
            margin-top: 30px;
            display: inline-block;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .navbar a {
            color: #4a6fa5;
            text-decoration: none;
            margin: 0 20px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
        }

        .navbar a:after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -5px;
            left: 0;
            background-color: #4a6fa5;
            transition: width 0.3s ease;
        }

        .navbar a:hover {
            color: #2c3e50;
        }

        .navbar a:hover:after {
            width: 100%;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            animation: scaleIn 0.6s ease-out;
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 30px;
            color: #2c3e50;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        h2 {
            color: #4a6fa5;
            margin-bottom: 10px;
            transition: transform 0.3s ease;
            font-weight: 600;
        }

        h2:hover {
            transform: scale(1.02);
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: #5d6d7e;
            line-height: 1.8;
        }

        .container .card {
            background: rgba(255, 255, 255, 0.8);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .container .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            padding: 10px 20px;
            background-color: #4a6fa5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #2c3e50;
        }

        .action-buttons {
            margin-top: 10px;
        }

        .action-buttons button {
            margin-right: 10px;
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 12px 15px;
            }
            .navbar a { 
                margin: 0 10px; 
                font-size: 14px; 
            }
            h1 { 
                font-size: 2.2rem; 
            }
            .container {
                padding: 30px 20px;
            }
            p { 
                font-size: 1rem; 
            }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <a href="index.html">Home</a>
        <a href="gallery.php">Gallery</a>
        <a href="blog.html">Blog</a>
        <a href="contact.html">Contact</a>
    </div>

    <!-- Konten -->
    <div class="container">
        <h1>Blog</h1>

        <!-- Form Artikel -->
        <form id="formArtikel">
            <input type="hidden" id="id" />
            <div class="form-group">
                <label>Judul</label>
                <input type="text" id="judul" placeholder="Judul artikel" required />
            </div>
            <div class="form-group">
                <label>Konten</label>
                <textarea id="konten" rows="4" placeholder="Isi artikel" required></textarea>
            </div>
            <button type="submit">Simpan</button>
        </form>

        <hr style="margin: 40px 0; border: 0; border-top: 1px solid #ddd;">

        <!-- Daftar Artikel -->
        <div id="daftarArtikel"></div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const form = document.getElementById("formArtikel");
            const idInput = document.getElementById("id");
            const judulInput = document.getElementById("judul");
            const kontenInput = document.getElementById("konten");
            const daftarArtikel = document.getElementById("daftarArtikel");

            async function fetchArtikel() {
                const res = await fetch("artikel.php");
                const data = await res.json();
                daftarArtikel.innerHTML = "";
                data.forEach(({id, judul, konten}) => {
                    const div = document.createElement("div");
                    div.className = "card";
                    div.innerHTML = `
                        <h2>${judul}</h2>
                        <p>${konten}</p>
                        <div class="action-buttons">
                            <button onclick="editArtikel(${id}, \`${judul.replace(/`/g, '\\`')}\`, \`${konten.replace(/`/g, '\\`')}\`)">Edit</button>
                            <button onclick="hapusArtikel(${id})">Hapus</button>
                        </div>
                    `;
                    daftarArtikel.appendChild(div);
                });
            }

            form.onsubmit = async (e) => {
                e.preventDefault();
                const id = idInput.value;
                const judul = judulInput.value;
                const konten = kontenInput.value;

                const method = id ? "PUT" : "POST";
                const body = JSON.stringify({ id, judul, konten });

                await fetch("artikel.php", {
                    method,
                    headers: { "Content-Type": "application/json" },
                    body
                });

                form.reset();
                fetchArtikel();
            };

            window.editArtikel = (id, judul, konten) => {
                idInput.value = id;
                judulInput.value = judul;
                kontenInput.value = konten;
                window.scrollTo({ top: 0, behavior: "smooth" });
            };

            window.hapusArtikel = async (id) => {
                if (confirm("Yakin ingin menghapus artikel ini?")) {
                    await fetch("artikel.php", {
                        method: "DELETE",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ id })
                    });
                    fetchArtikel();
                }
            };

            fetchArtikel();
        });
    </script>
</body>
</html>
