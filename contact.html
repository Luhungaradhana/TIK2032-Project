<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Website Sederhana</title>
    <style>
        /* Reset dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            scroll-behavior: smooth;
        }

        /* Background Gradient */
        body {
            background: linear-gradient(120deg, #f5f7fa, #c3cfe2);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Navbar Style */
        .navbar {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            border-radius: 12px;
            margin-bottom: 40px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .navbar a {
            color: #4a6fa5;
            text-decoration: none;
            margin: 0 20px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
        }

        .navbar a:after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -5px;
            left: 0;
            background-color: #4a6fa5;
            transition: width 0.3s ease;
        }

        .navbar a:hover {
            color: #2c3e50;
        }

        .navbar a:hover:after {
            width: 100%;
        }

        /* Konten Utama */
        h1 {
            font-size: 2.8rem;
            margin-bottom: 20px;
            color: #2c3e50;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 1.1rem;
            margin: 10px 0;
            color: #5d6d7e;
        }

        a {
            color: #4a6fa5;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s, transform 0.3s;
            display: inline-block;
        }

        a:hover {
            color: #2c3e50;
            transform: translateY(-2px);
        }

        /* Card Efek */
        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            animation: scaleIn 0.6s ease-out;
            min-width: 320px;
            max-width: 500px;
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Responsive Desain */
        @media (max-width: 600px) {
            .navbar {
                padding: 12px 15px;
            }
            .navbar a { 
                margin: 0 10px; 
                font-size: 14px; 
            }
            h1 { 
                font-size: 2.2rem; 
            }
            .card {
                padding: 30px 20px;
                min-width: 280px;
            }
            p { 
                font-size: 1rem; 
            }
        }
    </style>
</head>
<body>

    </div>

</body>
</html>
